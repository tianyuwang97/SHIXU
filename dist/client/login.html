<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>登录 · 时序 SHIXU</title><meta name="description" content="登录时序管理员预览账号，查看完整选股规则。"><link rel="stylesheet" href="/login.css"></head>
<body><div class="login-page">
<main class="login-main"><header class="login-brand"><h1>时序</h1><span lang="en">SHIXU</span></header>
<section class="login-form" aria-label="管理员预览登录"><form id="adminLogin"><fieldset id="loginFields" disabled><legend class="visually-hidden">管理员账号登录</legend><input type="text" name="username" value="admin" autocomplete="username" class="visually-hidden" tabindex="-1" aria-hidden="true" readonly><label for="loginPassword" class="visually-hidden">管理员密码</label><input id="loginPassword" type="password" placeholder="输入您的密码" autocomplete="current-password" maxlength="256" required><button id="loginSubmit" type="submit">登录</button></fieldset></form><p id="loginStatus" class="login-status" role="status" aria-live="polite">管理员预览账号</p><div id="signedIn" hidden><p id="accountName"></p><a id="continueResearch" class="continue-research" href="/">查看完整规则</a><button id="signOut" type="button">退出登录</button></div><p class="login-entry"><a id="guestEntry" class="login-guest" href="/">先以访客进入</a></p><noscript><p class="login-status">请启用 JavaScript 使用登录。</p></noscript></section></main>
<div class="login-coin-stage" aria-hidden="true"><div class="login-coin-rise"><img id="loginCoin" src="/coin-dollar.png" width="1024" height="1024" alt="" fetchpriority="high" decoding="async"></div></div></div><script src="/login.js" defer></script></body></html>
